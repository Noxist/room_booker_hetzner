{% extends "layout.html" %}
{% block content %}
<div id="statusBanner" class="alert alert-secondary shadow-sm mb-4 d-flex align-items-center" role="alert">
    <i id="statusIcon" class="bi bi-info-circle-fill fs-4 me-3 text-info"></i>
    <div><h5 class="alert-heading mb-0" id="statusText">Lade Status...</h5></div>
</div>
<div class="row g-4">
  <div class="col-lg-5">
    <div class="card shadow-sm border-0"><div class="card-body p-4">
        <h5 class="fw-bold mb-3">Buchung</h5>
        <form method="POST" action="/book">
          <div class="mb-3"><input type="text" name="date" class="form-control bg-dark text-white" placeholder="Datum (z.B. 14.02)"></div>
          <div class="row mb-3">
            <div class="col"><input type="text" name="start" class="form-control bg-dark text-white" placeholder="08:00" required></div>
            <div class="col"><input type="text" name="end" class="form-control bg-dark text-white" placeholder="12:00" required></div>
          </div>
          <div class="mb-3"><select name="category" class="form-select bg-dark text-white">{% for k, v in categories.items() %}<option value="{{ k }}">{{ v.title }}</option>{% endfor %}</select></div>
          <div class="mb-3"><select name="frequency" class="form-select bg-dark text-white"><option value="onetime">Einmalig</option><option value="weekly">Wöchentlich</option></select></div>
          <button type="submit" class="btn btn-primary w-100">Starten</button>
        </form>
    </div></div>
  </div>
  <div class="col-lg-7"><div class="card shadow-sm border-0"><div class="card-body p-0">
    <iframe src="https://calendar.google.com/calendar/embed?src=3aa0292bb1019576073ee6521bdf7f12f1c795703be4cd02333217a809397b6e@group.calendar.google.com&ctz=Europe%2FZurich" style="border:0; width:100%; height:450px;" frameborder="0"></iframe>
  </div></div></div>
</div>
<script>
function updateStatus() {
    fetch('/api/status').then(r=>r.json()).then(d=>{
        document.getElementById('statusText').innerText=d.msg;
        const b=document.getElementById('statusBanner');
        b.className = "alert shadow-sm mb-4 d-flex align-items-center " + (d.state==='success'?"alert-success":d.state==='error'?"alert-danger":"alert-info");
    });
}
setInterval(updateStatus, 2000); updateStatus();
</script>
{% endblock %}
